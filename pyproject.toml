[project]
name = "aziz-jan-sop-knowledge"
version = "0.1.0"
description = "Permission-aware SOP knowledge platform for Aziz Jan Trust"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.40.0",
  "fastapi>=0.116.0",
  "firebase-admin>=7.1.0",
  "httpx>=0.28.0",
  "openpyxl>=3.1.5",
  "pinecone>=7.0.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "pymongo>=4.13.0",
  "pypdf>=5.8.0",
  "python-docx>=1.2.0",
  "python-multipart>=0.0.20",
  "structlog>=25.4.0",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "boto3-stubs[s3]>=1.40.0",
  "mypy>=1.17.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "pytest-cov>=6.2.0",
  "ruff>=0.12.0",
  "types-openpyxl>=3.1.5"
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = [".venv"]

[tool.uv]
package = false
